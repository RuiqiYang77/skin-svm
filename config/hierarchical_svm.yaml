model: hierarchical_svm

data:
  image_dir: data/image
  mask_dir: data/mask
  label_csv: data/label.csv
  output_dir: outputs

hierarchical_svm:
  split:
    train_size: 0.7
    val_size: 0.1
    test_size: 0.2
    random_state: 42
    group_by: base_id

  features:
    use_color: true
    use_texture: true
    use_shape: true
    use_hog: false
    use_clinical: true
    use_advanced_color: true
    use_advanced_texture: true
    use_advanced_shape: true
    use_melanin_features: true
    use_dermoscopic_color: true
    use_dermoscopic_asymmetry: true
    use_dermoscopic_border: true
    use_pigment_network: true
    use_dots_globules: true
    use_streaks: true
    use_regression_structures: true
    mask_threshold: 127
    hsv_hist_bins: 16
    lbp_points: 24
    lbp_radius: 3
    lbp_multi_radii: [1, 3, 5, 7]

  preprocessing:
    normalize: true
    morphology: false
    hair_removal: true
    clahe: true
    clahe_kernel: 8
    clahe_clip: 0.02
    color_normalize: true
    shades_of_gray_p: 6

  # soft routing: only assign vasc if p(vasc) >= this threshold
  vasc_threshold: 0.5

  # Stage 1: vasc vs (nv + mel)
  stage1:
    model:
      kernel: rbf
      class_weight: balanced
      probability: true
      random_state: 42
    pca:
      enabled: true
      n_components: 0.90
    feature_selection:
      enabled: true
      k: 60   # tighter selection; vasc separation needs few, clean features
    grid_search:
      enabled: true
      cv: 5
      n_jobs: -1
      scoring: f1_vasc
      C: [0.1, 1, 10, 100]
      gamma: [scale, auto, 0.0001, 0.001, 0.01, 0.1]

  # Stage 2: nv vs mel (non-vasc only)
  stage2:
    model:
      kernel: rbf
      class_weight: balanced
      probability: true
      random_state: 42
    pca:
      enabled: true
      n_components: 0.95
    feature_selection:
      enabled: true
      k: 80   # focus on top dermoscopic features for nv/mel discrimination
    grid_search:
      enabled: true
      cv: 5
      n_jobs: -1
      scoring: f1_mel
      C: [0.1, 1, 10, 100, 1000]
      gamma: [scale, auto, 0.0001, 0.001, 0.01, 0.1]
